<script>
    // Генерируем ссылку на этот же сайт, но с флагом raw=1 для HAPP
    const finalConfigUrl = window.location.href.split('?')[0] + "?raw=1";
    document.getElementById('codeView').innerText = finalConfigUrl;
    document.getElementById('codeView').style.display = "block";

    function copyLink() {
        navigator.clipboard.writeText(finalConfigUrl).then(() => {
